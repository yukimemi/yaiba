[workspace]
resolver = "2"
members = ["crates/yaiba-core", "crates/yaiba-server", "crates/yaiba-sync"]

[workspace.package]
version      = "0.19.0"
edition      = "2024"
# Floor set by iroh 1.0, which the sync layer depends on.
rust-version = "1.91"
license      = "MIT"
repository   = "https://github.com/yukimemi/yaiba"
homepage     = "https://github.com/yukimemi/yaiba"
authors      = ["yukimemi <yukimemi@gmail.com>"]

[profile.dev]
# Windows MSVC link.exe hits PDB LIMIT (LNK1318) once the dependency
# tree gets big (axum + sqlx + reqwest + jsonwebtoken + tokio-cron-
# scheduler + tracing all carry many monomorphisations on the same
# workspace). Line-tables-only debug info keeps backtraces useful
# while keeping the PDB inside the linker's per-record limit on
# Windows. No effect on Linux / macOS builds.
debug = "line-tables-only"

[workspace.dependencies]
# Shared dependency pins. Member crates declare them with
#   foo = { workspace = true }
# so version bumps happen in one place.
anyhow              = "1.0.104"
axum                = { version = "0.8.9", features = ["macros"] }
chrono              = { version = "0.4.45", features = ["serde"] }
clap                = { version = "4.6.6", features = ["derive", "env"] }
# Only the fuzzy picker is used; the default feature set drags in the
# password / editor / history prompts this binary never shows.
dialoguer           = { version = "0.12.0", default-features = false, features = ["fuzzy-select"] }
dirs                = "6.0.0"
iroh                = "1.0.3"
kaishin             = "0.6.4"
mime_guess          = "2.0.5"
# Dev-only: generates the throwaway CA that stands in for a proxy's.
# The test reads DER straight out of it, so the default `pem` feature is
# dead weight; `ring` is the backend iroh already builds.
rcgen               = { version = "0.14.8", default-features = false, features = ["ring"] }
# The MCP server reaches the running yaiba through its own HTTP API rather
# than opening the database — see the header of `mcp.rs` for why. TLS is
# dropped because the only host it ever dials is loopback, and reqwest is
# already in the tree via iroh, so this adds no build time.
reqwest             = { version = "0.13.4", default-features = false, features = ["json"] }
# The official MCP SDK. `transport-io` is the stdio server — what
# `claude mcp add` launches — and `schemars` derives each tool's input
# schema from its request struct, so the schema cannot drift from the
# arguments the tool actually reads.
rmcp                = { version = "3.1.1", features = ["server", "macros", "transport-io", "schemars"] }
rusqlite            = { version = "0.40.1", features = ["bundled", "chrono"] }
rust-embed          = "8.12.0"
# Reads the machine's own CA roots, which yaiba-sync hands to iroh so a
# TLS-inspecting proxy's CA is trusted. See `ca_tls_config` there.
rustls-native-certs = "0.8.4"
# Dev-only: `ServerName` / `UnixTime` for driving the verifier directly.
rustls-pki-types    = "1.15.1"
# Derives the JSON Schema for each MCP tool's arguments. Pinned here
# because rmcp re-exports it and the two must agree on the major.
schemars            = "1.2.2"
serde               = { version = "1.0.229", features = ["derive"] }
serde_json          = "1.0.151"
thiserror           = "2.0.19"
tokio               = { version = "1.53.1", features = ["full"] }
# Dev-only: `ServiceExt::oneshot`, for driving handlers without a socket.
tower               = { version = "0.5.3", features = ["util"] }
toml                = "1.1.4"
tower-http          = { version = "0.7.0", features = ["cors", "trace"] }
tracing             = "0.1.44"
tracing-subscriber  = { version = "0.3.23", features = ["env-filter"] }
uuid                = { version = "1.24.0", features = ["v4", "v7", "serde"] }

# The workspace's own crates. Here for the reason the block exists: they
# carry a `version` because all three are published, and crates.io wants
# a requirement it can resolve for someone who is not building from this
# checkout. A path alone would not do.
#
# They lived in the member manifests until v0.17.0, which is the release
# that showed why they should not: `cargo build` after bumping
# `workspace.package.version` failed with "candidate versions found which
# didn't match", because three literals elsewhere still said 0.16.0. The
# releases before it were all patch bumps, and `version = "0.16.0"` means
# `^0.16.0`, which 0.16.1 satisfies — so the pins could sit stale for as
# long as nobody changed the minor, and then break the one release that
# did. `check-versions.rs` is what stops them going stale again.
yaiba-core          = { path = "crates/yaiba-core", version = "0.19.0" }
yaiba-sync          = { path = "crates/yaiba-sync", version = "0.19.0" }

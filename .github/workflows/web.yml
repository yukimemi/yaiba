# Type-check and build the SPA that rust-embed bakes into the binary.
#
# Until this existed, the TypeScript in `crates/yaiba-server/web` was
# checked by nothing. `ci.yml` is Rust-only (`cargo check`, `test`,
# `fmt`, `clippy`, `llvm-cov`); `cargo make check` is
# fmt-check + clippy + test + lock-check and does **not** depend on
# `web-build`. The only job that ever compiled the SPA was
# `release.yml`, and only on a tag — so a type error merged green and
# surfaced as a broken release.
#
# It runs the same `check-*` scripts as `cargo make web-build`, and the
# two lists have to stay equal. They drifted once already: `web.yml`
# calls `bun run build` — the package's own script, which is
# `tsc -b && vite build` and nothing else — while the checks live in the
# cargo-make task beside it, so three of them (cells, pin, row menu)
# were gating releases and no PR. A check that only a tag runs is a
# check that reports after the merge it should have refused.
#
# Lives in its own workflow rather than in `ci.yml` because `ci.yml` is
# kata-managed (rendered from yukimemi/pj-rust) and a local edit there
# is reverted by the next `kata apply`. A sibling workflow is the
# pattern the templates themselves prescribe for project-specific
# steps.
#
# Runs on EVERY pull request. NOT path-filtered to `web/**`, even
# though that would skip ~40s on a Rust-only PR, because a required
# status check that never runs on a given PR reports as forever-pending
# and blocks the merge — so a path-filtered job cannot be required, and
# a job that cannot be required is only advisory. yukimemi/kanade
# learned this the expensive way: with the equivalent job advisory,
# #1096 and #1101 both auto-merged RED and produced two tagged releases
# (v0.44.27, v0.44.28) with no binaries, the builds having died at
# `web-build`. This repo merges with `gh pr merge --auto --squash`,
# which is exactly that mechanism. "Cannot be skipped" is the safety
# property a gate is for.
#
# The job name is the status-check context. Renaming it silently
# un-requires the check on `main` — the old context stops reporting and
# branch protection keeps waiting for a name nothing produces.

name: web

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - name: Install deps
        working-directory: crates/yaiba-server/web
        # --frozen-lockfile: the committed bun.lock pins the tree, so a
        # transitive bump can't change what is being type-checked here
        # without showing up as a lockfile diff first.
        run: bun install --frozen-lockfile

      - name: Type-check and build
        working-directory: crates/yaiba-server/web
        # `bun run build` is `tsc -b && vite build`, the package's own
        # definition — so this checks what `cargo make web-build`
        # produces rather than a second, drifting copy of the command.
        run: bun run build

      - name: Check the translations
        working-directory: crates/yaiba-server/web
        # `t()` takes a string, so neither half of this is a type error:
        # a phrase added without a Japanese line ships silently in
        # English, and one reworded in English strands its old
        # translation as a line nothing will ever print. Both stay
        # invisible until somebody runs the UI in `ja` and reads every
        # screen.
        run: node scripts/check-i18n.mjs

      - name: Check the folding rules
        working-directory: crates/yaiba-server/web
        # The fold state is pure client-side view logic, so `ci.yml` never
        # sees it and the type-check above passes a filter that hides the
        # wrong rows just as happily as one that hides the right ones. #80
        # shipped exactly that way: after `zM` no `za` could open
        # anything, and nothing was ever going to fail a check. `bun`, not
        # `node`, because this imports the app's TypeScript to execute it.
        run: bun scripts/check-folds.ts

      - name: Check the cell grid
        working-directory: crates/yaiba-server/web
        # `cellStep` decides whether `h`/`l` walks a cell or folds a
        # subtree, and `cellEdit` decides which field an edit key opens.
        # Both are pure functions of state that only a real keyboard
        # would otherwise exercise — #80 shipped a keymap rule that no
        # check could see, which is the reason this file exists at all.
        run: bun scripts/check-cells.ts

      - name: Check the pin rules
        working-directory: crates/yaiba-server/web
        # `pinStartOps` is the one place the "a pin adjusts the lag it
        # crosses" rule lives, and five gestures commit through it. A
        # sixth that patches `start` directly is the one that goes stale,
        # so the rule is asserted rather than restated.
        run: bun scripts/check-pin.ts

      - name: Check the row menu
        working-directory: crates/yaiba-server/web
        # The menu holds what the mouse cannot otherwise reach, and the
        # failure that actually happens is nobody deleting the menu item
        # a new direct gesture made redundant. Asserted against
        # `DIRECT_GESTURES` so the build says which item to drop.
        run: bun scripts/check-rowmenu.ts

      - name: Check the blade effects
        working-directory: crates/yaiba-server/web
        # The class names are built from `FlashKind` (`row--${kind}`), so
        # a kind with no CSS behind it type-checks and draws nothing. And
        # an effect that cannot be turned off is worse than one that is
        # missing: office mode has to survive a shared screen, and
        # `prefers-reduced-motion` is not a preference to honour when
        # convenient. Neither is visible to `tsc`.
        run: bun scripts/check-flash.ts

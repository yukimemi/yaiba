<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` is what makes `env(safe-area-inset-*)` report
         anything but 0. Without it the page is laid out inside the safe
         area, every inset computes to zero, and the styles that spend them
         look correct on every device without a notch — so the touch bar
         sits under the home bar on exactly the phones it was written for. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>yaiba 刃</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

[package]
# The crate that carries the binary owns the plain name, so users get
# `cargo install yaiba` and then `yaiba`. The directory keeps the
# `-server` suffix to say what it holds next to `-core` and `-sync`.
name        = "yaiba"
description = "Vim-flavoured todo & gantt planner that ships as a single binary with its web UI embedded, and syncs peer-to-peer"
keywords    = ["todo", "gantt", "vim", "p2p", "crdt"]
categories  = ["command-line-utilities"]
readme      = "README.md"
include = [
    "src/**/*",
    "build.rs",
    # Only the built SPA bundle — rust-embed reads dist/ at compile
    # time. node_modules/ and the Vite sources under web/src/ don't
    # ship to crates.io; release CI rebuilds the bundle before publish
    # so the published bytes match the tagged commit.
    "web/dist/**/*",
    "Cargo.toml",
]
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
authors.workspace      = true

[dependencies]
yaiba-core.workspace = true
yaiba-sync.workspace = true

anyhow             = { workspace = true }
axum               = { workspace = true }
base64             = { workspace = true }
chrono             = { workspace = true }
clap               = { workspace = true }
dialoguer          = { workspace = true }
dirs               = { workspace = true }
kaishin            = { workspace = true }
mime_guess         = { workspace = true }
reqwest            = { workspace = true }
rmcp               = { workspace = true }
rust-embed         = { workspace = true }
schemars           = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
sha2               = { workspace = true }
tokio              = { workspace = true }
toml               = { workspace = true }
tower-http         = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
yaiba-sync = { workspace = true }
tower      = { workspace = true }
# Dev-only: `mcp.rs`'s tests build tasks with chosen ids, because what
# they pin down is how an id is matched.
uuid       = { workspace = true }

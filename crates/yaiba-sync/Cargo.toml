[package]
name        = "yaiba-sync"
description = "Peer-to-peer replication for yaiba over iroh QUIC — no server in the middle"
keywords    = ["crdt", "p2p", "iroh", "sync", "replication"]
readme      = "README.md"
categories  = ["network-programming"]
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
authors.workspace      = true

[dependencies]
yaiba-core = { path = "../yaiba-core", version = "0.13.0" }

anyhow              = { workspace = true }
iroh                = { workspace = true }
rustls-native-certs = { workspace = true }
serde               = { workspace = true }
serde_json          = { workspace = true }
tokio               = { workspace = true }
tracing             = { workspace = true }

[dev-dependencies]
# Stands in for a TLS-inspecting proxy: a CA nobody's Mozilla list has
# heard of, so the test can tell "trusted because the machine says so"
# from "trusted anyway".
rcgen            = { workspace = true }
rustls-pki-types = { workspace = true }

[package]
name        = "yaiba-core"
description = "Domain model, CRDT store and dependency-graph scheduling for yaiba"
keywords    = ["todo", "gantt", "crdt", "scheduling", "hlc"]
readme      = "README.md"
categories  = ["data-structures", "date-and-time"]
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
authors.workspace      = true

[dependencies]
anyhow     = { workspace = true }
chrono     = { workspace = true }
rusqlite   = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }
uuid       = { workspace = true }

[dev-dependencies]
# Only the version check in `tests/check_versions.rs` needs it — reading a
# manifest by substring is how that test shipped its own false negative.
toml = { workspace = true }

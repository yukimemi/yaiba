<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 150" width="620" height="150" role="img" aria-label="yaiba — vim-flavoured todo and gantt, peer to peer">
  <defs>
    <linearGradient id="edge" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity=".12"/>
    </linearGradient>
  </defs>

  <rect width="620" height="150" rx="10" fill="#05070d"/>

  <!-- Timeline grid, confined to the right half. The wordmark owns the
       left; nothing is drawn behind the type. -->
  <g stroke="#0e1626" stroke-width="1">
    <path d="M410 40.5H620M410 70.5H620M410 100.5H620"/>
    <path d="M440.5 22V128M480.5 22V128M520.5 22V128M560.5 22V128M600.5 22V128"/>
  </g>

  <!-- Three bars chained by finish-to-start edges: the shape of the
       gantt, reduced to its bones. Each edge leaves one bar's right
       edge and enters the next one's left, so the picture reads the way
       the scheduler actually works — and magenta means critical path,
       the same rule the app follows. -->
  <g>
    <rect x="424" y="31" width="62" height="14" rx="2" fill="url(#bar)" stroke="#0e7490"/>
    <rect x="494" y="61" width="46" height="14" rx="2" fill="url(#bar)" stroke="#0e7490"/>
    <rect x="548" y="91" width="48" height="14" rx="2" fill="rgba(244,114,182,.16)" stroke="#f472b6"/>
    <path d="M486 38h4v30h4" fill="none" stroke="#0e7490" stroke-width="1.2"/>
    <path d="M540 68h4v30h4" fill="none" stroke="#f472b6" stroke-width="1.2"/>
  </g>

  <!-- The blade -->
  <path d="M42 111 L88 36 L100 43 L54 118 Z" fill="url(#edge)"/>
  <path d="M42 111 L54 118 L32 123 Z" fill="#94a3b8"/>

  <text x="126" y="84" font-family="ui-monospace, 'Cascadia Code', 'JetBrains Mono', Consolas, monospace"
        font-size="42" font-weight="700" letter-spacing="12" fill="#22d3ee">YAIBA</text>
  <text x="128" y="110" font-family="ui-monospace, 'Cascadia Code', 'JetBrains Mono', Consolas, monospace"
        font-size="11.5" letter-spacing="1.6" fill="#64748b">刃 — todo &amp; gantt, peer to peer</text>
</svg>
